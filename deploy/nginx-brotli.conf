brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types application/json application/manifest+json application/xml
             application/rss+xml application/javascript text/javascript
             text/plain text/css text/xml image/svg+xml text/x-component
             application/x-ndjson image/x-icon;
brotli_static on;
gzip_static on;
