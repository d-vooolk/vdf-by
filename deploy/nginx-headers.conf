add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000" always;

# Сайт не обращается ни к одному внешнему домену: шрифты, картинки и
# скрипты свои. Поэтому политику можно закрутить жёстко — с одной
# оговоркой про 'unsafe-inline' в script-src.
#
# Next кладёт в HTML пять инлайновых <script> с данными страницы
# (self.__next_f.push) — без них React не оживит разметку: не заработают
# корзина, поиск и переключение цоколя. Убрать их нельзя, а разрешить
# можно двумя способами: nonce на каждый запрос или 'unsafe-inline'.
# Nonce обязан быть уникальным для каждого посетителя, а значит каждая
# страница становится динамической — весь смысл предсобранного каталога
# теряется. Поэтому здесь 'unsafe-inline'; XSS при этом сдерживает то,
# что пользовательского HTML на витрине нет вообще.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by https://*.google-analytics.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by https://yastatic.net https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by wss://mc.yandex.ru wss://mc.yandex.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src blob: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by; child-src blob: https://mc.yandex.ru https://mc.yandex.com; frame-ancestors 'self' https://webvisor.com https://*.webvisor.com https://metrika.yandex.ru https://metrika.yandex.by; base-uri 'self'; form-action 'self'; object-src 'none'" always;
