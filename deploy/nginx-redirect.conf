# ------------------------------------------------------------------
# auto-svet.by — прежний домен магазина, переехавшего на vdf.by
#
# Постраничный 301: адрес пути сохраняется, /catalog/lampy/ ведёт на
# /catalog/lampy/ нового домена. Свалить всё на главную нельзя — поисковик
# считает это soft-404 и накопленный вес страниц не передаёт.
#
# Сертификат старого домена продолжаем продлевать: без него браузер упрётся
# в ошибку HTTPS раньше, чем увидит редирект.
#   certbot certificates
# ------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name auto-svet.by www.auto-svet.by;

    # Проверка владения доменом при продлении сертификата — до редиректа.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://vdf.by$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auto-svet.by www.auto-svet.by;

    ssl_certificate /etc/letsencrypt/live/auto-svet.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto-svet.by/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/auto-svet.by.access.log;
    error_log  /var/log/nginx/auto-svet.by.error.log;

    return 301 https://vdf.by$request_uri;
}
