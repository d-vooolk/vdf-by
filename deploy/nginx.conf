# ------------------------------------------------------------------
# vdf.by — магазин автосвета
#
# Сайт это Node-процесс под PM2 (приложение «vdf», порт 3011), nginx
# перед ним обратный прокси. Порт не 3000: на этом сервере 3000 занят
# главным сайтом prime-auto, 3010 тоже занят.
#
# Файлы, которые не требуют участия Node — сборку и фотографии — nginx
# отдаёт сам, напрямую с диска: это быстрее и разгружает приложение.
#
# Сертификат выписывает certbot; блоки 80 и 443 описаны здесь целиком,
# поэтому копирование этого файла поверх живого конфига HTTPS не ломает.
# Если сертификата на сервере ещё нет, nginx -t упадёт на ssl_certificate —
# сначала certbot --nginx -d vdf.by -d www.vdf.by, потом копировать.
# ------------------------------------------------------------------

map $uri $next_asset {
    ~^/_next/static/(?<asset>.+)$ $asset;
}

map $http_user_agent $vdf_search_bot {
    default 0;
    ~*(yandex|googlebot|google-inspectiontool|googleother|adsbot-google|storebot-google|mediapartners-google|bingbot|duckduckbot|mail\.ru_bot|applebot|telegrambot|whatsapp|viber|facebookexternalhit|twitterbot|vkshare) 1;
}

map $http_user_agent $vdf_scraper {
    default 0;
    ~*(python-requests|python-urllib|aiohttp|httpx|scrapy|httrack|go-http-client|libwww-perl|wget|java/|okhttp|colly|headlesschrome|phantomjs|puppeteer|playwright|ahrefsbot|semrushbot|mj12bot|dotbot|petalbot|bytespider|dataforseobot|blexbot) 1;
}

map "$vdf_search_bot:$http_rsc" $vdf_page_key {
    default $binary_remote_addr;
    ~^1: "";
    ~^0:1$ "";
}

map "$vdf_search_bot:$http_rsc" $vdf_rsc_key {
    default "";
    "0:1" $binary_remote_addr;
}

map $vdf_search_bot $vdf_img_key {
    default $binary_remote_addr;
    1 "";
}

limit_req_zone $vdf_page_key zone=vdf_pages:20m rate=60r/m;
limit_req_zone $vdf_page_key zone=vdf_pages_long:20m rate=20r/m;
limit_req_zone $vdf_rsc_key zone=vdf_rsc:20m rate=5r/s;
limit_req_zone $vdf_img_key zone=vdf_img:20m rate=10r/s;

map $upstream_http_cache_control $vdf_cache_control {
    default $upstream_http_cache_control;
    ~s-maxage "public, max-age=0, must-revalidate";
}

upstream vdf_app {
    server 127.0.0.1:3011;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name vdf.by www.vdf.by;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://vdf.by$request_uri;
    }
}

server {
    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    server_name vdf.by www.vdf.by;

    ssl_certificate /etc/letsencrypt/live/vdf.by/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vdf.by/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Корень нужен только для alias/try_files ниже.
    root /var/www/vdf.by/public;

    charset utf-8;

    access_log /var/log/nginx/vdf.by.access.log;
    error_log  /var/log/nginx/vdf.by.error.log;

    # ---------------------------------------------------------------
    # Безопасность
    # ---------------------------------------------------------------
    include /var/www/vdf.by/deploy/nginx-headers.conf;

    if ($host = www.vdf.by) {
        return 301 https://vdf.by$request_uri;
    }

    # ---------------------------------------------------------------
    # Сжатие
    # ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/manifest+json application/xml
               application/rss+xml application/javascript text/javascript
               text/plain text/css text/xml image/svg+xml text/x-component
               application/x-ndjson image/x-icon;

    include /etc/nginx/vdf-brotli*.conf;

    open_file_cache max=5000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_errors on;

    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_hide_header X-Powered-By;

    # ---------------------------------------------------------------
    # Файлы, которые nginx отдаёт сам
    # ---------------------------------------------------------------

    # Файлы сборки Next и картинки из препроцессора содержат хеш или размер
    # в имени: при изменении меняется имя файла. Значит их можно кешировать
    # навсегда — повторные визиты не делают ни одного запроса за ними.
    location ^~ /_next/static/ {
        root /var/www/vdf.by;
        try_files /.next-a/static/$next_asset /.next-b/static/$next_asset /.next/static/$next_asset =404;
        include /var/www/vdf.by/deploy/nginx-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /img/ {
        limit_req zone=vdf_img burst=400 nodelay;
        include /var/www/vdf.by/deploy/nginx-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /video/ {
        include /var/www/vdf.by/deploy/nginx-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2|woff|ttf)$ {
        include /var/www/vdf.by/deploy/nginx-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~ ^/(?:brand|chatIcons)/ {
        include /var/www/vdf.by/deploy/nginx-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # Админка
    # ---------------------------------------------------------------

    # Загрузка фотографий: файлы бывают крупные, а обработка (sharp делает
    # шесть версий каждого снимка) занимает секунды. Общий лимит в 1 МБ и
    # таймаут в 30 с сюда не годятся.
    location /admin/api/upload {
        proxy_pass http://vdf_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location /admin/api/upload/video {
        proxy_pass http://vdf_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 510m;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Панель не кешируется никогда и никем: там чужие заказы с телефонами.
    location /admin/ {
        proxy_pass http://vdf_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        include /var/www/vdf.by/deploy/nginx-headers.conf;
        add_header Cache-Control "no-store" always;
        client_max_body_size 4m;
        proxy_read_timeout 120s;
    }

    # ---------------------------------------------------------------
    # Всё остальное — приложению
    # ---------------------------------------------------------------
    location / {
        if ($vdf_scraper) {
            return 403;
        }

        limit_req zone=vdf_pages burst=120 nodelay;
        limit_req zone=vdf_pages_long burst=600 nodelay;
        limit_req zone=vdf_rsc burst=300 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://vdf_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Пустой Connection включает keepalive до upstream: без него nginx
        # открывает новое соединение на каждый запрос.
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        proxy_hide_header Cache-Control;
        include /var/www/vdf.by/deploy/nginx-headers.conf;
        add_header Cache-Control $vdf_cache_control always;
    }

    # Мусорные запросы к следам других CMS — не пишем в лог и не тратим время.
    location ~* /(wp-admin|wp-login|xmlrpc\.php|\.env|\.git) {
        access_log off;
        return 404;
    }

    client_max_body_size 1m;
}
