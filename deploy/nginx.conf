# ------------------------------------------------------------------
# vdf.by — магазин автосвета
#
# Сайт это Node-процесс под PM2 (приложение «vdf», порт 3011), nginx
# перед ним обратный прокси. Порт не 3000: на этом сервере 3000 занят
# главным сайтом prime-auto, 3010 тоже занят.
#
# Файлы, которые не требуют участия Node — сборку и фотографии — nginx
# отдаёт сам, напрямую с диска: это быстрее и разгружает приложение.
#
# Сертификат выписывается после переключения DNS:
#   certbot --nginx -d vdf.by -d www.vdf.by
# ------------------------------------------------------------------

upstream vdf_app {
    server 127.0.0.1:3011;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name vdf.by www.vdf.by;

    # Корень нужен только для alias/try_files ниже.
    root /var/www/vdf.by/public;

    charset utf-8;

    access_log /var/log/nginx/vdf.by.access.log;
    error_log  /var/log/nginx/vdf.by.error.log;

    # ---------------------------------------------------------------
    # Безопасность
    # ---------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Сайт не обращается ни к одному внешнему домену: шрифты, картинки и
    # скрипты свои. Поэтому политику можно закрутить жёстко — с одной
    # оговоркой про 'unsafe-inline' в script-src.
    #
    # Next кладёт в HTML пять инлайновых <script> с данными страницы
    # (self.__next_f.push) — без них React не оживит разметку: не заработают
    # корзина, поиск и переключение цоколя. Убрать их нельзя, а разрешить
    # можно двумя способами: nonce на каждый запрос или 'unsafe-inline'.
    # Nonce обязан быть уникальным для каждого посетителя, а значит каждая
    # страница становится динамической — весь смысл предсобранного каталога
    # теряется. Поэтому здесь 'unsafe-inline'; XSS при этом сдерживает то,
    # что пользовательского HTML на витрине нет вообще.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---------------------------------------------------------------
    # Файлы, которые nginx отдаёт сам
    # ---------------------------------------------------------------

    # Файлы сборки Next и картинки из препроцессора содержат хеш или размер
    # в имени: при изменении меняется имя файла. Значит их можно кешировать
    # навсегда — повторные визиты не делают ни одного запроса за ними.
    location /_next/static/ {
        alias /var/www/vdf.by/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /img/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------
    # Админка
    # ---------------------------------------------------------------

    # Загрузка фотографий: файлы бывают крупные, а обработка (sharp делает
    # шесть версий каждого снимка) занимает секунды. Общий лимит в 1 МБ и
    # таймаут в 30 с сюда не годятся.
    location /admin/api/upload {
        proxy_pass http://vdf_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Панель не кешируется никогда и никем: там чужие заказы с телефонами.
    location /admin/ {
        proxy_pass http://vdf_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        client_max_body_size 4m;
    }

    # ---------------------------------------------------------------
    # Всё остальное — приложению
    # ---------------------------------------------------------------
    location / {
        if ($host = www.vdf.by) {
            return 301 https://vdf.by$request_uri;
        }

        proxy_pass http://vdf_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Пустой Connection включает keepalive до upstream: без него nginx
        # открывает новое соединение на каждый запрос.
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Мусорные запросы к следам других CMS — не пишем в лог и не тратим время.
    location ~* /(wp-admin|wp-login|xmlrpc\.php|\.env|\.git) {
        access_log off;
        return 404;
    }

    client_max_body_size 1m;
}
